name: Test and build Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'matronix/**'
      - 'tests/**'
      - 'run.pyw'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
      - 'packaging/**'
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -c "from PySide6.QtWidgets import QApplication; from matronix.app import Window"
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check selective downloads (1.12.2 and 26.2)
        run: python -c "exec(open('tests/live_online.py').read())"
      - run: python -m PyInstaller --noconfirm --windowed --onefile --icon matronix/icon.ico --add-data "matronix/versions.json;matronix" --add-data "matronix/icon.png;matronix" --name Matronix run.pyw
      - name: Check EXE starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/Matronix.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Matronix exited during startup: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/Matronix.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Test install and uninstall
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "Matronix-install-test"
          $setup = Start-Process "dist/MatronixSetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          if (!(Test-Path "$target/Matronix.exe")) { throw "Installed EXE is missing" }
          $app = Start-Process "$target/Matronix.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Installed EXE exited during startup" }
          Stop-Process -Id $app.Id -Force
          $uninstall = Start-Process "$target/unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed" }
          if (Test-Path "$target/Matronix.exe") { throw "Uninstall did not remove EXE" }
      - uses: actions/upload-artifact@v4
        with:
          name: Matronix-Installer
          path: dist/MatronixSetup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Matronix-Windows
          path: dist/Matronix.exe
